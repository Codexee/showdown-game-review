[project]
name = "showdown-game-review"
version = "0.1.0"
description = "Local Lichess-style review tool for Pokemon Showdown games"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "torch>=2.15.0",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
